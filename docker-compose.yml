services:
  cupsponsor:
    build:
      context: .
      args:
        # Compose reads these from the .env file sitting next to this one.
        # They are inlined at build time, so a change here needs a rebuild.
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${NEXT_PUBLIC_PLAUSIBLE_DOMAIN:-}
        NEXT_PUBLIC_PLAUSIBLE_HOST: ${NEXT_PUBLIC_PLAUSIBLE_HOST:-}
    image: cupsponsor:latest
    container_name: cupsponsor
    restart: unless-stopped
    env_file: .env
    # Published on all interfaces, not loopback: outlive.lol's Caddy is itself a
    # container and reaches this through host.docker.internal, which resolves to
    # the bridge gateway rather than the host's 127.0.0.1. Same arrangement as
    # warhorn.app on 3021. 3021, 3022 and 3031 are taken on this box.
    ports:
      - "3042:3000"
    volumes:
      # Everything mutable: the auction database, the uploaded sponsor logos and
      # the morning photographs. One volume, so one thing to back up. Seeded
      # from the image on first run.
      - ./volumes/data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/spot').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
